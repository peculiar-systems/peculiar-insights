name: peculiar_insights_flutter
description: Flutter bindings for the Peculiar Insights client, wiring platform context, error capture and app lifecycle.
version: 0.1.0
publish_to: none
repository: https://github.com/peculiar-systems/peculiar-insights

environment:
  sdk: ^3.8.0
  flutter: ">=3.35.0"

dependencies:
  device_info_plus: ^12.0.0
  fast_immutable_collections: ^11.0.0
  fixnum: ^1.1.0
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  package_info_plus: ^9.0.0
  path_provider: ^2.1.0
  peculiar_insights:
    path: ../peculiar_insights
  sqlite3_flutter_libs: ^0.5.0
  web: ^1.1.0

dev_dependencies:
  ai_dart_linter: ^0.1.0
  build_runner: ^2.4.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.0
  json_serializable: ^6.9.0

flutter:
  plugin:
    platforms:
      android:
        package: systems.peculiar.insights.flutter
        pluginClass: PeculiarInsightsFlutterPlugin
      ios:
        pluginClass: PeculiarInsightsFlutterPlugin
      macos:
        pluginClass: PeculiarInsightsFlutterPlugin
